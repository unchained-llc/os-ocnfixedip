name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install check prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils php-cli
      - name: Static checks and regression tests
        run: python3 os-ocnfixedip/tools/check.py --require-php
